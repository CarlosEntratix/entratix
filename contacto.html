<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto - Entratix</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif; font-size: 14px; line-height: 1.2;
      color: #fff;
      background: url('fondo.jpg') no-repeat center center fixed;
      background-size: cover; overflow-x: hidden;
    }

    /* ── HEADER ── */
    .header {
      position: sticky; top: 0; z-index: 1000;
      background-color: rgba(255,255,255,0.97);
      backdrop-filter: blur(4px);
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 81px; height: 60px;
    }

    .logo-img { width: 107px; height: 23px; object-fit: contain; }
    .nav-menu { display: flex; list-style: none; gap: 40px; align-items: center; }

    .nav-link {
      text-decoration: none; color: #373736; font-size: 14px;
      font-weight: 400; padding: 12px 0; transition: color 0.3s;
    }

    .nav-link.active {
      color: #FFFFFF; background-color: #F28F22;
      padding: 12px 38px; border-radius: 4px;
    }

    .nav-link:hover { color: #F28F22; }

    .demo-btn {
      background-color: #F28F22; color: #FFFFFF; border: none;
      padding: 12px 23px; font-size: 14px; font-weight: 400; cursor: pointer;
      border-radius: 4px; font-family: 'Montserrat', sans-serif; white-space: nowrap;
      transition: background 0.3s, transform 0.15s;
    }

    .demo-btn:hover { background-color: #e07d1a; transform: translateY(-1px); }
    .demo-btn:active { transform: translateY(0); }

    /* Hamburger */
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 6px; z-index: 1100;
    }

    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: #373736; border-radius: 2px; transition: all 0.3s;
    }

    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,0.98); z-index: 1050;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 20px;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      text-decoration: none; color: #373736; font-size: 20px;
      font-family: 'Montserrat', sans-serif; padding: 10px 0; transition: color 0.2s;
    }

    .mobile-menu a.active { color: #F28F22; font-weight: 700; }
    .mobile-menu a:hover { color: #F28F22; }

    .mobile-menu .demo-btn {
      margin-top: 10px; width: 220px; text-align: center;
      font-size: 16px; padding: 14px 23px;
    }

    /* ── FORM ── */
    main {
      max-width: 600px; margin: 60px auto 100px;
      padding: 36px 32px;
      background: rgba(0,0,0,0.58); border-radius: 10px;
      animation: fadeInUp 0.8s ease both;
    }

    main h1 { font-size: 42px; font-weight: 700; margin-bottom: 36px; color: white; }

    form { display: flex; flex-direction: column; gap: 0; }

    .field { margin-bottom: 20px; }

    label { font-weight: 600; font-size: 14px; color: white; margin-bottom: 7px; display: block; }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%; padding: 12px 14px;
      border: 2px solid rgba(255,255,255,0.25); border-radius: 6px;
      font-size: 14px; font-family: 'Montserrat', sans-serif;
      background: rgba(255,255,255,0.08); color: white;
      transition: border-color 0.3s, background 0.3s;
      resize: vertical;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      outline: none;
      border-color: #F28F22;
      background: rgba(255,255,255,0.14);
    }

    /* Validación en tiempo real */
    input.valid, textarea.valid { border-color: #4caf72; }
    input.invalid, textarea.invalid { border-color: #e05252; }

    .field-msg {
      font-size: 12px; margin-top: 5px; height: 16px;
      transition: opacity 0.3s; opacity: 0;
    }

    .field-msg.show { opacity: 1; }
    .field-msg.ok { color: #6ddb95; }
    .field-msg.err { color: #f28080; }

    textarea { min-height: 120px; }

    button[type="submit"] {
      background-color: #F28F22; color: #FFFFFF; border: none;
      padding: 14px 0; font-size: 16px; font-weight: 600;
      border-radius: 6px; cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: background 0.3s, transform 0.15s;
      margin-top: 6px;
    }

    button[type="submit"]:hover { background-color: #e07d1a; transform: translateY(-1px); }
    button[type="submit"]:active { transform: translateY(0); }
    button[type="submit"]:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    /* Mensaje de éxito */
    .success-msg {
      display: none; text-align: center; padding: 24px;
      background: rgba(77,175,100,0.2); border: 1px solid #4caf72;
      border-radius: 8px; margin-top: 20px;
    }

    .success-msg h3 { color: #6ddb95; font-size: 22px; margin-bottom: 10px; }
    .success-msg p { color: #ccc; font-size: 15px; }

    /* ── BACK TO TOP ── */
    .back-to-top {
      position: fixed; bottom: 28px; right: 28px;
      width: 44px; height: 44px; background-color: #F28F22;
      color: #fff; border: none; border-radius: 50%; font-size: 22px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; z-index: 900;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      transition: opacity 0.3s, transform 0.3s, background 0.2s;
    }

    .back-to-top.visible { opacity: 1; pointer-events: auto; }
    .back-to-top:hover { transform: translateY(-3px); background-color: #e07d1a; }

    /* ── FOOTER ── */
    .footer { background-color: rgba(145,145,145,0.65); padding: 18px 0; }

    .footer-content {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1200px; margin: 0 auto; padding: 0 119px;
    }

    .footer-logo-img { width: 135px; height: 29px; object-fit: contain; }
    .social-links { display: flex; gap: 16px; }
    .social-icon { width: 27px; height: 27px; object-fit: contain; transition: transform 0.2s; }
    .social-link:hover .social-icon { transform: scale(1.15); opacity: 0.85; }

    /* ── ANIMACIONES ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════ RESPONSIVE ══════════════════════════ */
    @media (max-width: 1024px) {
      .nav { padding: 0 40px; }
      .nav-menu { gap: 20px; }
      .footer-content { padding: 0 40px; }
    }

    @media (max-width: 768px) {
      .nav { padding: 0 20px; }
      .nav-menu { display: none; }
      .demo-btn.desktop-btn { display: none; }
      .hamburger { display: flex; }

      main { margin: 32px 16px 60px; padding: 24px 20px; }
      main h1 { font-size: 32px; margin-bottom: 24px; }

      .footer-content { flex-direction: column; gap: 16px; padding: 0 20px; text-align: center; }
      .back-to-top { bottom: 16px; right: 16px; width: 40px; height: 40px; font-size: 18px; }
    }

    @media (max-width: 480px) {
      main h1 { font-size: 28px; }
      input[type="text"], input[type="email"], textarea { font-size: 16px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">
        <a href="index.html">
          <img src="https://static.codia.ai/image/2025-10-17/XgqFsGtfwj.png" alt="Logo Entratix" class="logo-img" />
        </a>
      </div>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="industrias.html" class="nav-link">Industrias</a></li>
        <li><a href="industrias.html#clientes" class="nav-link">Clientes</a></li>
        <li><a href="servicios.html" class="nav-link">Servicios</a></li>
        <li><a href="productos.html" class="nav-link">Productos</a></li>
        <li><a href="contacto.html" class="nav-link active">Contacto</a></li>
      </ul>
      <button class="demo-btn desktop-btn" onclick="window.location.href='contacto.html'">Realiza tu demo</button>
      <button class="hamburger" id="hamburger" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="industrias.html">Industrias</a>
    <a href="industrias.html#clientes">Clientes</a>
    <a href="servicios.html">Servicios</a>
    <a href="productos.html">Productos</a>
    <a href="contacto.html" class="active">Contacto</a>
    <button class="demo-btn" onclick="window.location.href='contacto.html'">Realiza tu demo</button>
  </div>

  <main>
    <h1>Contáctanos</h1>
    <form id="contactForm" action="https://formsubmit.co/jose@yapps.lat" method="POST" novalidate>
      <input type="hidden" name="_cc" value="luis@yapps.lat">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="about:blank">

      <div class="field">
        <label for="nombre">Nombre*</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" autocomplete="name" required />
        <p class="field-msg" id="msg-nombre"></p>
      </div>

      <div class="field">
        <label for="correo">Correo*</label>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
        <p class="field-msg" id="msg-correo"></p>
      </div>

      <div class="field">
        <label for="asunto">Asunto*</label>
        <input type="text" id="asunto" name="asunto" placeholder="¿En qué te podemos ayudar?" required />
        <p class="field-msg" id="msg-asunto"></p>
      </div>

      <div class="field">
        <label for="preguntas">Preguntas / Mensaje*</label>
        <textarea id="preguntas" name="preguntas" placeholder="Cuéntanos más sobre tu evento o consulta..." required></textarea>
        <p class="field-msg" id="msg-preguntas"></p>
      </div>

      <button type="submit" id="submitBtn">Enviar mensaje</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h3>¡Mensaje enviado!</h3>
      <p>Gracias por contactarnos. Te responderemos a la brevedad.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <img src="https://static.codia.ai/image/2025-10-17/XgqFsGtfwj.png" alt="Logo Entratix" class="footer-logo-img" loading="lazy" />
      <div class="social-links">
        <a href="https://www.instagram.com/entratix?igsh=MTloaWxmeTF5anA3Mw==" class="social-link" aria-label="Instagram"><img src="https://static.codia.ai/image/2025-10-17/ikmxz7cZJB.png" alt="Instagram" class="social-icon" loading="lazy" /></a>
        <a href="https://www.facebook.com/share/1CmKuKx52B/" class="social-link" aria-label="Facebook"><img src="https://static.codia.ai/image/2025-10-17/fPix7jp7x8.png" alt="Facebook" class="social-icon" loading="lazy" /></a>
        <a href="https://www.linkedin.com/company/entratix?trk=blended-typeahead" class="social-link" aria-label="LinkedIn"><img src="https://static.codia.ai/image/2025-10-17/8k2sUR3Yks.png" alt="LinkedIn" class="social-icon" loading="lazy" /></a>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="Volver arriba">&#8679;</button>

  <script>
    /* Hamburger */
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });

    mobileMenu.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });

    /* Validación en tiempo real */
    function validate(input, msgEl, checkFn) {
      input.addEventListener('input', () => {
        const { ok, msg } = checkFn(input.value.trim());
        input.classList.toggle('valid', ok);
        input.classList.toggle('invalid', !ok && input.value.length > 0);
        msgEl.textContent = msg;
        msgEl.className = 'field-msg show ' + (ok ? 'ok' : 'err');
        if (!input.value.length) msgEl.classList.remove('show');
      });
    }

    validate(
      document.getElementById('nombre'),
      document.getElementById('msg-nombre'),
      v => v.length >= 2
        ? { ok: true, msg: '✓ Nombre válido' }
        : { ok: false, msg: 'Ingresa tu nombre completo' }
    );

    validate(
      document.getElementById('correo'),
      document.getElementById('msg-correo'),
      v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)
        ? { ok: true, msg: '✓ Correo válido' }
        : { ok: false, msg: 'Ingresa un correo válido' }
    );

    validate(
      document.getElementById('asunto'),
      document.getElementById('msg-asunto'),
      v => v.length >= 3
        ? { ok: true, msg: '✓ Listo' }
        : { ok: false, msg: 'Ingresa el asunto' }
    );

    validate(
      document.getElementById('preguntas'),
      document.getElementById('msg-preguntas'),
      v => v.length >= 10
        ? { ok: true, msg: '✓ Mensaje listo' }
        : { ok: false, msg: 'El mensaje debe tener al menos 10 caracteres' }
    );

    /* Envío con confirmación visual */
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const allValid = ['nombre', 'correo', 'asunto', 'preguntas'].every(id => {
        const el = document.getElementById(id);
        return el.value.trim().length > 0 && el.classList.contains('valid');
      });

      if (!allValid) {
        form.querySelectorAll('input, textarea').forEach(el => {
          if (!el.value.trim()) { el.classList.add('invalid'); }
        });
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const data = new FormData(form);
        await fetch(form.action, { method: 'POST', body: data, mode: 'no-cors' });
        form.style.display = 'none';
        successMsg.style.display = 'block';
      } catch {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar mensaje';
        alert('Ocurrió un error. Por favor intenta de nuevo.');
      }
    });

    /* Back to top */
    const btn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => btn.classList.toggle('visible', window.scrollY > 400));
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>
</body>
</html>
